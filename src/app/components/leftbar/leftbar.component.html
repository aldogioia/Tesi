<main class="{{ settingsService.font }} {{ settingsService.mode }}">

  <div class="left-bar {{settingsService.layout}}" [ngClass]="{'close' : isClose}">
    <div class="header">
      <h1>Menu</h1>
      <div>
        <svg (click)="isClose = !isClose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 17" fill="none">
          <path d="M1.33334 8.5C1.33334 6.00018 1.33334 4.75027 1.96995 3.87405C2.17555 3.59107 2.42441 3.34221 2.70739 3.13661C3.58361 2.5 4.83352 2.5 7.33334 2.5H8.66668C11.1665 2.5 12.4164 2.5 13.2926 3.13661C13.5756 3.34221 13.8245 3.59107 14.0301 3.87405C14.6667 4.75027 14.6667 6.00018 14.6667 8.5C14.6667 10.9998 14.6667 12.2497 14.0301 13.1259C13.8245 13.4089 13.5756 13.6578 13.2926 13.8634C12.4164 14.5 11.1665 14.5 8.66668 14.5H7.33334C4.83352 14.5 3.58361 14.5 2.70739 13.8634C2.42441 13.6578 2.17555 13.4089 1.96995 13.1259C1.33334 12.2497 1.33334 10.9998 1.33334 8.5Z" stroke-linejoin="round"/>
          <path d="M6.33334 2.83331V14.1666" stroke-linejoin="round"/>
          <path d="M3.33334 5.16669C3.33334 5.16669 3.94282 5.16669 4.33334 5.16669" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3.33334 7.83331H4.33334" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="arrowToRotate" d="M11.6667 9.33333L10.9619 8.51567C10.6656 8.17187 10.5174 8 10.3333 8C10.1493 8 10.0011 8.17187 9.70479 8.51567L8.99999 9.33333" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <div class="content">
      <div class="sub-content">

        <div [ngClass]="{'close' : isCloseB}" class="section blu" *ngIf="isAdmin">
          <div class="header-section">
            <h2>Professori</h2>
            <div>
              <svg (click)="isCloseB = !isCloseB" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 13 13" fill="none">
                <path d="M9.5 5.00002C9.5 5.00002 7.29055 8 6.5 8C5.7094 8 3.5 5 3.5 5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
          <div class="content-section">
            <div class="item" [routerLink]="['/professors']" routerLinkActive="active">
              <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 17 17" fill="none">
                <path d="M5.83334 3.8335H13.8333" stroke-linecap="round"/>
                <path d="M3.16666 3.8335H3.17264" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3.16666 8.5H3.17264" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3.16666 13.1665H3.17264" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5.83334 8.5H13.8333" stroke-linecap="round"/>
                <path d="M5.83334 13.1665H13.8333" stroke-linecap="round"/>
              </svg>
              <a>Elenco Professori</a>
            </div>

            <div class="item" [routerLink]="['/add-professor']" routerLinkActive="active" *ngIf="isAdmin">
              <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 17 17" fill="none">
                <path d="M8.5 3.1665V13.8332" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3.16666 8.5H13.8333" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <a>Nuovo Professore</a>
            </div>
          </div>
        </div>

        <div [ngClass]="{'close' : isCloseO}" class="section orange"  *ngIf="isAdmin">
          <div class="header-section">
            <h2>Progetti</h2>
            <div>
              <svg (click)="isCloseO = !isCloseO" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 13 13" fill="none">
                <path d="M9.5 5.00002C9.5 5.00002 7.29055 8 6.5 8C5.7094 8 3.5 5 3.5 5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
          <div class="content-section">
            <div class="item" [routerLink]="['/projects']" routerLinkActive="active">
              <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 17 17" fill="none">
                <path d="M5.83334 3.8335H13.8333" stroke-linecap="round"/>
                <path d="M3.16666 3.8335H3.17264" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3.16666 8.5H3.17264" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3.16666 13.1665H3.17264" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5.83334 8.5H13.8333" stroke-linecap="round"/>
                <path d="M5.83334 13.1665H13.8333" stroke-linecap="round"/>
              </svg>
              <a>Elenco Progetti</a>
            </div>
            <div class="item" [routerLink]="['/add-project']" routerLinkActive="active">
              <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 17 17" fill="none">
                <path d="M8.5 3.1665V13.8332" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3.16666 8.5H13.8333" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <a>Nuovo Progetto</a>
            </div>
          </div>
        </div>

        <div [ngClass]="{'close' : isCloseG}" class="section purple">
          <div class="header-section">
            <h2>Collaborazioni</h2>
            <div>
              <svg (click)="isCloseG = !isCloseG" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 13 13" fill="none">
                <path d="M9.5 5.00002C9.5 5.00002 7.29055 8 6.5 8C5.7094 8 3.5 5 3.5 5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
          <div class="content-section">
            <div class="item" [routerLink]="['/yearly-detail']" routerLinkActive="active">
              <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 17 17" fill="none">
                <path d="M12.75 1.4165V2.83317M4.25 1.4165V2.83317" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2.125 5.6665H14.875" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M1.77087 8.67227C1.77087 5.58587 1.77087 4.04266 2.65779 3.08383C3.54471 2.125 4.97218 2.125 7.82712 2.125H9.17296C12.0279 2.125 13.4554 2.125 14.3423 3.08383C15.2292 4.04266 15.2292 5.58587 15.2292 8.67227V9.03607C15.2292 12.1225 15.2292 13.6657 14.3423 14.6245C13.4554 15.5833 12.0279 15.5833 9.17296 15.5833H7.82712C4.97218 15.5833 3.54471 15.5833 2.65779 14.6245C1.77087 13.6657 1.77087 12.1225 1.77087 9.03607V8.67227Z" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M6.375 10.625H10.625" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <a>Dettaglio Annuale</a>
            </div>

            <div class="item" [routerLink]="['/monthly-detail']" routerLinkActive="active">
              <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 17 17" fill="none">
                <path d="M12.75 1.4165V2.83317M4.25 1.4165V2.83317" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M8.49677 9.2085H8.50315M8.49677 12.0418H8.50315M11.3269 9.2085H11.3333M5.66663 9.2085H5.67298M5.66663 12.0418H5.672" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2.47913 5.6665H14.5208" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M1.77087 8.67227C1.77087 5.58587 1.77087 4.04266 2.65779 3.08383C3.54471 2.125 4.97218 2.125 7.82712 2.125H9.17296C12.0279 2.125 13.4554 2.125 14.3423 3.08383C15.2292 4.04266 15.2292 5.58587 15.2292 8.67227V9.03607C15.2292 12.1225 15.2292 13.6657 14.3423 14.6245C13.4554 15.5833 12.0279 15.5833 9.17296 15.5833H7.82712C4.97218 15.5833 3.54471 15.5833 2.65779 14.6245C1.77087 13.6657 1.77087 12.1225 1.77087 9.03607V8.67227Z" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2.125 5.6665H14.875" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <a>Dettaglio Mensile</a>
            </div>

            <div class="item" [routerLink]="['/calendar']" routerLinkActive="active">
              <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 17 17" fill="none">
                <path d="M12.5 1.83301V3.16634M4.5 1.83301V3.16634" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M7.16667 11.8337L7.16666 9.39846C7.16666 9.27066 7.0755 9.16699 6.96305 9.16699H6.5M9.58647 11.8337L10.4895 9.39979C10.5317 9.28599 10.4419 9.16699 10.3138 9.16699H9.16667" stroke-linecap="round"/>
                <path d="M2.16666 8.66213C2.16666 5.75729 2.16666 4.30485 3.0014 3.40243C3.83615 2.5 5.17965 2.5 7.86666 2.5H9.13332C11.8203 2.5 13.1639 2.5 13.9986 3.40243C14.8333 4.30485 14.8333 5.75729 14.8333 8.66213V9.00453C14.8333 11.9094 14.8333 13.3618 13.9986 14.2643C13.1639 15.1667 11.8203 15.1667 9.13332 15.1667H7.86666C5.17965 15.1667 3.83615 15.1667 3.0014 14.2643C2.16666 13.3618 2.16666 11.9094 2.16666 9.00453V8.66213Z" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4.5 5.83301H12.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <a>Rendicontazione</a>
            </div>

            <div class="item" [routerLink]="['/collaboration']" routerLinkActive="active" *ngIf="isAdmin">
              <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 17 17" fill="none">
                <path d="M8.5 3.1665V13.8332" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3.16666 8.5H13.8333" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <a>Nuovi Assegnamenti</a>
            </div>
          </div>
        </div>
      </div>

      <div class="item account" [routerLink]="['personal-area']" routerLinkActive="active">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 17 17" fill="none">
          <path d="M9.91663 6.375H12.75" stroke-linecap="round"/>
          <path d="M9.91663 8.85449H12.0416" stroke-linecap="round"/>
          <path d="M12.0416 2.125H4.95829C3.00228 2.125 1.41663 3.71066 1.41663 5.66667V11.3333C1.41663 13.2893 3.00228 14.875 4.95829 14.875H12.0416C13.9976 14.875 15.5833 13.2893 15.5833 11.3333V5.66667C15.5833 3.71066 13.9976 2.125 12.0416 2.125Z" stroke-linejoin="round"/>
          <path d="M3.54163 11.3337C4.39751 9.50538 7.58777 9.38511 8.49996 11.3337" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7.43746 6.37467C7.43746 7.15704 6.8032 7.79136 6.02079 7.79136C5.23839 7.79136 4.60413 7.15704 4.60413 6.37467C4.60413 5.59227 5.23839 4.95801 6.02079 4.95801C6.8032 4.95801 7.43746 5.59227 7.43746 6.37467Z"/>
        </svg>
        <a>{{professorName}}</a>
      </div>

    </div>
  </div>

  <router-outlet></router-outlet>

</main>
